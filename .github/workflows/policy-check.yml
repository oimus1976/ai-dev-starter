name: policy-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  starter-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # Pinned commit adopted from current reviewed CI; update deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        # Pinned commit adopted from current reviewed CI; update deliberately.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify baseline structure and adoption state
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"
