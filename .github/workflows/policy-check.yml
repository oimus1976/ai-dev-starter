name: policy-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  starter-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to the immutable release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.0.0, pinned to the immutable release commit.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify baseline structure and adoption state
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"
