name: policy-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        # actions/checkout v7.0.1; SHA resolved from the release tag at review time.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR checks validate the actual proposed head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0; SHA resolved from the release tag at review time.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile starter scripts
        run: >-
          python -m py_compile
          scripts/bootstrap.py
          scripts/verify_repo.py
          scripts/closeout_state.py
          scripts/verify_local_closeout.py
          scripts/post_merge_cleanup.py
          scripts/branch_cleanup_audit.py
      - name: Run canonical starter regression tests
        if: github.repository == 'oimus1976/ai-dev-starter'
        run: python -m unittest discover -s starter_tests -v
      - name: Verify baseline structure and adoption state
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"

  canonical-closeout-platform:
    if: github.repository == 'oimus1976/ai-dev-starter'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout
        # actions/checkout v7.0.1; SHA resolved from the release tag at review time.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0; SHA resolved from the release tag at review time.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile closeout tools
        run: python -m py_compile scripts/closeout_state.py scripts/verify_local_closeout.py scripts/post_merge_cleanup.py scripts/branch_cleanup_audit.py
      - name: Run local closeout verifier regressions
        run: python -m unittest discover -s starter_tests -p "test_local_closeout.py" -v
      - name: Run post-merge cleanup regressions
        run: python -m unittest discover -s starter_tests -p "test_post_merge_cleanup*.py" -v
      - name: Run authoritative branch cleanup regressions
        run: python -m unittest discover -s starter_tests -p "test_branch_cleanup*.py" -v
