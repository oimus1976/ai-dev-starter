name: project-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  starter-template-self-check:
    if: github.repository == 'oimus1976/ai-dev-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to the immutable release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v7.0.0, pinned to the immutable release commit.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile starter scripts
        run: python -m py_compile scripts/bootstrap.py scripts/verify_repo.py
      - name: Run starter regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify template repository
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"

  project-ci-not-configured:
    if: github.repository != 'oimus1976/ai-dev-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require project-specific CI configuration
        run: |
          echo "Replace .github/workflows/ci.yml with project-specific tests before accepting tracked implementation."
          exit 1
