name: project-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  starter-template-self-check:
    if: github.repository == 'oimus1976/ai-dev-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # Pinned commit adopted from current reviewed CI; update deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        # Pinned commit adopted from current reviewed CI; update deliberately.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile starter scripts
        run: python -m py_compile scripts/bootstrap.py scripts/verify_repo.py
      - name: Verify template repository
        run: python scripts/verify_repo.py --repository "${{ github.repository }}"

  project-ci-not-configured:
    if: github.repository != 'oimus1976/ai-dev-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require project-specific CI configuration
        run: |
          echo "Replace .github/workflows/ci.yml with project-specific tests before accepting tracked implementation."
          exit 1
